        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        
        /* Blueprint grid background for the visualizer */
        .blueprint-bg {
            background-color: #1e293b;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            background-position: center center;
        }

        /* Custom styling for the opacity slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }
        
        /* Map Image containers */
        .map-layer {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 8px;
        }

        // =========================================================================
        // ⚙️ WEBSITE LOGIC (You shouldn't need to edit below here) ⚙️
        // =========================================================================

        // DOM Elements
        const selectA = document.getElementById('mapA-select');
        const selectB = document.getElementById('mapB-select');
        const swapBtn = document.getElementById('swap-btn');
        const opacitySlider = document.getElementById('opacity-slider');
        const opacityVal = document.getElementById('opacity-val');
        
        const scaleWrapper = document.getElementById('scale-wrapper');
        const layerA = document.getElementById('map-a-layer');
        const layerB = document.getElementById('map-b-layer');

        // Initialization
        function init() {
            // Sort maps alphabetically for the dropdowns
            const sortedMaps = [...GAME_MAPS].sort((a, b) => a.name.localeCompare(b.name));

            // Populate Dropdowns
            sortedMaps.forEach(map => {
                const optionA = new Option(map.name, map.id);
                const optionB = new Option(map.name, map.id);
                selectA.add(optionA);
                selectB.add(optionB);
            });

            // Set initial default selections (first two items if available)
            if (GAME_MAPS.length >= 2) {
                selectA.value = GAME_MAPS[0].id;
                selectB.value = GAME_MAPS[1].id;
            }

            // Event Listeners
            selectA.addEventListener('change', updateVisuals);
            selectB.addEventListener('change', updateVisuals);
            
            opacitySlider.addEventListener('input', (e) => {
                const val = e.target.value;
                opacityVal.innerText = `${val}%`;
                layerB.style.opacity = val / 100;
            });

            swapBtn.addEventListener('click', () => {
                const temp = selectA.value;
                selectA.value = selectB.value;
                selectB.value = temp;
                updateVisuals();
            });

            // Initial Render
            updateVisuals();
            
            // Initial Opacity set
            layerB.style.opacity = opacitySlider.value / 100;
        }

        // Helper to find map data by ID
        function getMapData(id) {
            return GAME_MAPS.find(m => m.id === id);
        }

        // Main function to calculate scales and update the UI
        function updateVisuals() {
            const mapA = getMapData(selectA.value);
            const mapB = getMapData(selectB.value);

            if (!mapA || !mapB) return;

            // 1. Calculate the master bounding box needed to fit BOTH maps
            const maxW = Math.max(mapA.widthKm, mapB.widthKm);
            const maxH = Math.max(mapA.heightKm, mapB.heightKm);

            // Set the aspect ratio of the wrapper container so it mathematically 
            // matches the footprint of our maximum dimensions.
            scaleWrapper.style.aspectRatio = `${maxW} / ${maxH}`;

            // 2. Render Map A Layer
            // Calculate percentage size relative to the master bounding box
            const widthPctA = (mapA.widthKm / maxW) * 100;
            const heightPctA = (mapA.heightKm / maxH) * 100;
            
            layerA.style.width = `${widthPctA}%`;
            layerA.style.height = `${heightPctA}%`;
            layerA.style.backgroundImage = `url('${mapA.imageUrl}')`;
            layerA.style.border = `3px solid ${mapA.color}`;
            // Optional: Background color slightly tinted to make transparent images visible
            layerA.style.backgroundColor = `${mapA.color}15`; 

            // 3. Render Map B Layer
            const widthPctB = (mapB.widthKm / maxW) * 100;
            const heightPctB = (mapB.heightKm / maxH) * 100;

            layerB.style.width = `${widthPctB}%`;
            layerB.style.height = `${heightPctB}%`;
            layerB.style.backgroundImage = `url('${mapB.imageUrl}')`;
            layerB.style.border = `3px solid ${mapB.color}`;
            layerB.style.backgroundColor = `${mapB.color}15`;

            // 4. Update Stats & UI text
            updateStatsUI(mapA, mapB);
        }

        function updateStatsUI(mapA, mapB) {
            // Legends
            document.getElementById('legend-a-name').innerText = mapA.name;
            document.getElementById('legend-a-color').style.backgroundColor = mapA.color;
            document.getElementById('legend-b-name').innerText = mapB.name;
            document.getElementById('legend-b-color').style.backgroundColor = mapB.color;

            // Stats Panels
            document.getElementById('stats-a-name').innerText = mapA.name;
            document.getElementById('stats-a-name').style.color = mapA.color;
            document.getElementById('stats-a-border').style.borderColor = mapA.color;
            document.getElementById('stats-a-area').innerText = mapA.areaSqKm.toLocaleString(undefined, {minimumFractionDigits: 1, maximumFractionDigits: 2});
            document.getElementById('stats-a-dims').innerText = `${mapA.widthKm}x${mapA.heightKm} km`;

            document.getElementById('stats-b-name').innerText = mapB.name;
            document.getElementById('stats-b-name').style.color = mapB.color;
            document.getElementById('stats-b-border').style.borderColor = mapB.color;
            document.getElementById('stats-b-area').innerText = mapB.areaSqKm.toLocaleString(undefined, {minimumFractionDigits: 1, maximumFractionDigits: 2});
            document.getElementById('stats-b-dims').innerText = `${mapB.widthKm}x${mapB.heightKm} km`;

            // Conclusion Logic (Based on Area)
            const ratio = mapA.areaSqKm / mapB.areaSqKm;
            let conclusion = "";
            
            if (ratio > 1.05) {
                conclusion = `<span style="color:${mapA.color}" class="font-bold">${mapA.name}</span> is roughly <span class="text-white font-bold">${ratio.toFixed(1)}x larger</span> than <span style="color:${mapB.color}" class="font-bold">${mapB.name}</span>.`;
            } else if (ratio < 0.95) {
                const inverseRatio = mapB.areaSqKm / mapA.areaSqKm;
                conclusion = `<span style="color:${mapB.color}" class="font-bold">${mapB.name}</span> is roughly <span class="text-white font-bold">${inverseRatio.toFixed(1)}x larger</span> than <span style="color:${mapA.color}" class="font-bold">${mapA.name}</span>.`;
            } else {
                conclusion = `<span style="color:${mapA.color}" class="font-bold">${mapA.name}</span> and <span style="color:${mapB.color}" class="font-bold">${mapB.name}</span> are nearly <span class="text-white font-bold">identical</span> in size.`;
            }

            document.getElementById('stats-conclusion').innerHTML = conclusion;
        }

        // Start the app when the DOM is loaded
        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
